version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hrms-postgres-db
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms_user
      POSTGRES_PASSWORD: hrms_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: hrms-backend-service
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=prod-secret-key-change-this-in-env
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=hrms
      - DB_USER=hrms_user
      - DB_PASSWORD=hrms_secure_password
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:8080
    depends_on:
      - db

  frontend:
    build:
      context: ./hrms-frontend
      args:
        - VITE_API_URL=http://localhost:8000/api
    container_name: hrms-frontend-service
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
